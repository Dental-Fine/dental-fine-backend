spring.application.name=Dental-Fine-BackEnd
# Que no se nos olvide meter las variables de entorno al .env dios mio
api.security.token.secret=${JWT_SECRET:1234567890}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dentalfine_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
