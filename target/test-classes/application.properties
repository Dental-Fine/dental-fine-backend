# Tests: sin PostgreSQL ni Flyway; esquema generado por Hibernate para validar el contexto
spring.datasource.url=jdbc:h2:mem:dentalfine_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
api.security.token.secret=test_secret_for_tests_123456
